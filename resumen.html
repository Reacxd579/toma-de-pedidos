  </head>
  <body>
    <header>

      <button id="btn-actualizar" class="btn-actualizar">🔄 Actualizar</button>

    <section class="tabla-resumen-wrapper">

      </div>
    </section>

    <section class="tabla-resumen-wrapper">
      <h2>Detalle por nivel de precio</h2>
      <div id="contenedor-resumen">
        <p class="vacio">Todavía no hay pedidos confirmados.</p>
      </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
